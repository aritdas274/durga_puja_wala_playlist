<head>

    <link rel="icon" type="image/png" sizes="16x16"

    <title>আগমনী — Nostalgic Durga Puja</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Feather Icons for Player UI -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary: #d35400;
            --primary-light: #e67e22;
            --accent: #f1c40f;
            --bg-dark: #120c06;
            --glass-bg: rgba(18, 12, 6, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(211, 84, 0, 0.15);
            --font-bengali: 'Hind Siliguri', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            outline: none;
            -webkit-tap-highlight-color: transparent;
            /* Removes blue highlight on mobile touch */
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            background-image: url('https://i.ibb.co/TDXxmLH2/file-1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: var(--font-sans);
            color: #f5efe6;
        }

        /* Ambient Retro Screen Overlays */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.035;
            pointer-events: none;
            z-index: 3;
        }

        /* Main Container */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 1.5rem;
            z-index: 1;
            transition: transform 0.1s ease-out;
        }

        /* Header Elements */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand .presents {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .brand .title {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            backdrop-filter: blur(10px);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse 2s infinite;
        }

        /* Center Typography Frame */
        .hero-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            margin-top: -4vh;
        }

        .hero-title {
            font-family: var(--font-bengali);
            font-size: clamp(4.5rem, 12vw, 8.5rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            text-shadow:
                0 0 20px rgba(211, 84, 0, 0.6),
                0 0 40px rgba(0, 0, 0, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.9);
            transform: translateY(10px);
            animation: float 6s ease-in-out infinite;
        }

        .hero-subtitle {
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--accent);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            margin-top: 15px;
            font-weight: 500;
        }

        /* Durga Puja countdown */
        .puja-countdown {
            position: absolute;
            left: clamp(1.25rem, 5vw, 5rem);
            top: 50%;
            transform: translateY(-50%);
            width: min(285px, 25vw);
            text-align: left;
            font-family: var(--font-bengali);
            line-height: 1;
            z-index: 6;
        }

        .puja-countdown-label {
            display: block;
            position: relative;
            font-size: clamp(0.95rem, 1.5vw, 1.15rem);
            font-weight: 600;
            letter-spacing: 0.02em;
            color: rgba(255, 244, 208, 0.92);
            margin-bottom: 0.55rem;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .puja-countdown-main {
            display: flex;
            justify-content: flex-start;
            align-items: baseline;
            gap: 0.5rem;
        }

        .puja-countdown-number {
            display: inline-block;
            font-size: clamp(3.5rem, 7vw, 5.8rem);
            font-weight: 800;
            line-height: 0.85;
            color: #ffd84d;
            letter-spacing: -0.045em;
            min-width: 1.2em;
            position: relative;
            text-shadow:
                0 0 5px rgba(255, 216, 77, 0.95),
                0 0 18px rgba(241, 196, 15, 0.72),
                0 0 42px rgba(241, 196, 15, 0.35),
                0 4px 14px rgba(0, 0, 0, 0.8);
            animation: pujaNumberGlow 2.2s ease-in-out infinite;
        }

        .puja-countdown-number::after {
            content: "";
            display: block;
            width: 72%;
            height: 3px;
            margin-top: 0.38rem;
            border-radius: 99px;
            background: #f1c40f;
            box-shadow:
                0 0 8px rgba(241, 196, 15, 0.9),
                0 0 18px rgba(241, 196, 15, 0.55);
            transform-origin: left center;
            animation: pujaLinePulse 2.2s ease-in-out infinite;
        }

        .puja-countdown-days {
            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 700;
            color: #fff1bd;
            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.75),
                0 0 12px rgba(241, 196, 15, 0.2);
        }

        @keyframes pujaNumberGlow {

            0%,
            100% {
                transform: scale(1);
                text-shadow:
                    0 0 5px rgba(255, 216, 77, 0.9),
                    0 0 18px rgba(241, 196, 15, 0.6),
                    0 0 38px rgba(241, 196, 15, 0.25),
                    0 4px 14px rgba(0, 0, 0, 0.8);
            }

            50% {
                transform: scale(1.035);
                text-shadow:
                    0 0 8px rgba(255, 230, 120, 1),
                    0 0 25px rgba(241, 196, 15, 0.85),
                    0 0 52px rgba(241, 196, 15, 0.42),
                    0 4px 14px rgba(0, 0, 0, 0.8);
            }
        }

        @keyframes pujaLinePulse {

            0%,
            100% {
                transform: scaleX(0.82);
                opacity: 0.75;
            }

            50% {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .puja-countdown {
                position: absolute;
                left: 1rem;
                top: auto;
                bottom: 7.5rem;
                transform: none;
                width: auto;
            }

            .puja-countdown-number {
                font-size: 3rem;
            }

            .puja-countdown-label {
                font-size: 0.92rem;
            }

            .puja-countdown-number {
                font-size: 2.65rem;
            }

            .puja-countdown-days {
                font-size: 1.05rem;
            }
        }

        .quotes-container {
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            max-width: 600px;
            width: 90%;
        }

        .quote-text {
            font-family: var(--font-bengali);
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            text-align: center;
            line-height: 1.6;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 0;
            transform: translateY(10px);
        }

        .quote-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Player Area */
        .bottom-section {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            z-index: 10;
        }

        .glass-player {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45), inset 0 0 12px var(--glass-glow);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border-radius: 24px;
            padding: 1.25rem 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .vinyl-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #111;
            background-image: radial-gradient(circle, #333 30%, #111 70%, #000 100%);
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 6s linear infinite;
            animation-play-state: paused;
            transition: background-image 0.4s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .vinyl-inner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        .track-details {
            flex-grow: 1;
            min-width: 0;
            touch-action: pan-y;
            cursor: grab;
        }

        .track-details.swiping {
            cursor: grabbing;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-album {
            font-size: 0.72rem;
            color: var(--accent);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .desktop-swipe-hint {
            position: absolute;
            left: 50%;
            bottom: -18px;
            transform: translateX(-50%);
            font-size: 0.55rem;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.28);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        @media (min-width: 769px) {
            .track-details:hover .desktop-swipe-hint {
                opacity: 1;
            }
        }

        /* Playlist UI */
        .playlist-toggle {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease, background 0.2s ease;
        }

        .playlist-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.06);
        }

        .playlist-toggle.open {
            transform: rotate(180deg);
        }

        .playlist-panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.35s ease;
        }

        .playlist-panel.open {
            max-height: 260px;
            opacity: 1;
            margin-top: 4px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }

        .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .playlist-item {
            width: 100%;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.035);
            color: #fff;
            border-radius: 12px;
            padding: 7px 9px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateX(2px);
        }

        .playlist-item.active {
            background: rgba(211, 84, 0, 0.22);
            border-color: rgba(241, 196, 15, 0.35);
        }

        .playlist-thumb {
            width: 52px;
            height: 36px;
            object-fit: cover;
            border-radius: 7px;
            flex-shrink: 0;
            background: #222;
        }

        .playlist-item-info {
            min-width: 0;
            flex: 1;
        }

        .playlist-item-title {
            display: block;
            font-size: 0.76rem;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-number {
            display: block;
            margin-top: 2px;
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .playlist-loading {
            padding: 10px;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.7rem;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
            position: relative;
        }

        .progress-knob {
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-container:hover .progress-knob {
            opacity: 1;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .time-display {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            font-variant-numeric: tabular-nums;
            width: 45px;
        }

        .time-display.total {
            text-align: right;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.05);
        }

        .btn-play {
            background: #ffffff;
            color: #120c06;
            width: 42px;
            height: 42px;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-play:hover {
            background: var(--accent);
            color: #120c06;
            transform: scale(1.08);
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }

        .instruction-hint {
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            text-align: center;
            animation: pulse 3s infinite;
        }

        /* Keyboard feedback */
        .keyboard-warm-flash {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at center,
                    rgba(255, 214, 80, 0.30) 0%,
                    rgba(255, 190, 45, 0.14) 35%,
                    rgba(255, 165, 0, 0.05) 65%,
                    rgba(255, 140, 0, 0) 100%);
        }

        .keyboard-warm-flash.active {
            animation: warmKeyFlash 0.45s ease-out;
        }

        @keyframes warmKeyFlash {
            0% {
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        #interactive-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        #youtube-player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 200px;
            height: 200px;
            opacity: 0.001;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(10px) rotate(0deg);
            }

            50% {
                transform: translateY(-5px) rotate(0.5deg);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.8;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 1.5rem 1rem;
            }

            .hero-title {
                margin-top: 2vh;
            }

            .glass-player {
                padding: 1rem 1.25rem;
            }

            .playlist-panel.open {
                max-height: 220px;
            }
        }
    </style>
</head>

<body>
    <audio id="dhak-sound" src="dhak_sound_effect.mp3" preload="auto"></audio>
    <audio id="glitch-sound" src="glitch-sound-effect.mp3" preload="auto"></audio>

    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="keyboard-warm-flash" id="keyboard-warm-flash"></div>

    <canvas id="interactive-canvas"></canvas>

    <div class="app-container" id="main-view">
        <header>
            <div class="brand">
                <span class="presents">শরৎ নস্টালজিয়া</span>
                <span class="title">Kolkata Archives</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>পুজো মুড অন</span>
            </div>
        </header>

        <div class="hero-center">
            <h1 class="hero-title">আগমনী</h1>
            <p class="hero-subtitle">The Sound of Homecoming</p>

            <div class="puja-countdown" aria-live="polite">
                <span class="puja-countdown-label">মা আসতে আর খালি</span>
                <div class="puja-countdown-main">
                    <strong class="puja-countdown-number" id="puja-days">৬২</strong>
                    <span class="puja-countdown-days">দিন বাকি</span>
                </div>
            </div>

            <div class="quotes-container">
                <div class="quote-text" id="quote-box"></div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="glass-player">
                <div class="player-info">
                    <div class="vinyl-wrapper">
                        <div class="vinyl" id="vinyl-disc">
                            <div class="vinyl-inner"></div>
                        </div>
                    </div>

    <script>
        feather.replace();

        const pujaQuotes = [
            "শিউলি ফুলের গন্ধ আর ঢাকের আওয়াজ... পুজো এসে গেল।",
            "ষষ্ঠীর বোধন থেকে দশমীর সিঁদুর খেলা— এ এক অনন্ত আবেগ।",
            "মায়ের আগমনী সুরে মন মেতে ওঠে এক অদ্ভুত নস্টালজিয়ায়।",
            "ঘ্যাঁস ঘ্যাঁস করে চলা ট্রাম, আর কলেজ স্ট্রিটের পুজোর গন্ধ।",
            "আসছে বছর আবার হবে!",
            "কাশফুলের দোলা আর মেঘের ভেলা— পুজো শুরু এখনই।"
        ];

        let quoteIndex = 0;
        const quoteBox = document.getElementById('quote-box');

        function updateQuote() {
            quoteBox.style.opacity = 0;
            quoteBox.style.transform = 'translateY(10px)';

            setTimeout(() => {
                quoteBox.textContent = pujaQuotes[quoteIndex];
                quoteBox.style.opacity = 1;
                quoteBox.style.transform = 'translateY(0)';
                quoteIndex = (quoteIndex + 1) % pujaQuotes.length;
            }, 800);
        }

        updateQuote();
        setInterval(updateQuote, 6000);

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRadioGlitch() {
            initAudio();
            const now = audioCtx.currentTime;
            const duration = 0.3;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            const bandpassFilter = audioCtx.createBiquadFilter();
            bandpassFilter.type = 'bandpass';
            bandpassFilter.frequency.setValueAtTime(1600, now);
            bandpassFilter.frequency.exponentialRampToValueAtTime(300, now + duration);
            bandpassFilter.Q.setValueAtTime(4.0, now);

            const glitchGain = audioCtx.createGain();
            glitchGain.gain.setValueAtTime(0.2, now);
            glitchGain.gain.exponentialRampToValueAtTime(0.005, now + duration);

            noiseNode.connect(bandpassFilter);
            bandpassFilter.connect(glitchGain);
            glitchGain.connect(audioCtx.destination);

            noiseNode.start(now);
            noiseNode.stop(now + duration);
        }

        // Canvas Setup
        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Mouse & Spring Physics Tracker
        const mouse = { x: width / 2, y: height / 2 };
        const springPoint = { x: width / 2, y: height / 2, vx: 0, vy: 0 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        const STIFFNESS = 0.035;
        const DAMPING = 0.82;
        const SMOKE_DENSITY = 4;

        class SmokeParticle {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx * 0.25 + (Math.random() - 0.5) * 1.5;
                this.vy = vy * 0.25 - Math.random() * 1.2 - 0.4;
                this.size = Math.random() * 12 + 10;
                this.opacity = Math.random() * 0.45 + 0.35;
                this.rotation = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.03;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.size += 0.8;
                this.rotation += this.spin;
                this.opacity -= 0.005;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.opacity);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                grad.addColorStop(0, 'rgba(240, 225, 205, 0.75)');
                grad.addColorStop(0.4, 'rgba(210, 180, 150, 0.4)');
                grad.addColorStop(0.8, 'rgba(120, 90, 70, 0.15)');
                grad.addColorStop(1, 'rgba(18, 12, 6, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FestiveParticle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type || (Math.random() > 0.55 ? 'marigold' : 'kash');

                this.size = this.type === 'marigold'
                    ? Math.random() * 8 + 6
                    : Math.random() * 5 + 4;

                this.vx = Math.random() * 1.2 - 0.6;
                this.vy = Math.random() * 1.5 + 1.0;

                this.windFactor = Math.random() * 0.8 + 0.55;
                this.airDrag = Math.random() * 0.018 + 0.008;
                this.gravity = Math.random() * 0.012 + 0.008;

                this.angle = Math.random() * 360;
                this.spin = Math.random() * 2 - 1;
                this.spinVelocity = this.spin;

                this.opacity = Math.random() * 0.4 + 0.6;

                this.phase = Math.random() * Math.PI * 2;
                this.phaseSpeed = Math.random() * 0.025 + 0.012;
            }

            update() {
                if (particleMotionFrozen) return;

                const naturalWind =
                    Math.sin((performance.now() * 0.001) * 0.75 + this.phase) *
                    0.20 *
                    this.windFactor;

                const keyboardWindX = keyboardAirX * this.windFactor;
                const keyboardWindY = keyboardAirY * this.windFactor;

                this.vx += (naturalWind + keyboardWindX) * 0.16;

                this.vy += this.gravity;
                this.vy += keyboardWindY * 0.48;

                this.vx *= (1 - this.airDrag);
                this.vy *= 0.994;

                this.vx = Math.max(-7, Math.min(7, this.vx));
                this.vy = Math.max(-7, Math.min(7, this.vy));

                this.x += this.vx;
                this.y += this.vy;

                this.spinVelocity += keyboardAirX * 0.045 + keyboardAirY * 0.035;
                this.spinVelocity *= 0.985;
                this.spinVelocity = Math.max(-3, Math.min(3, this.spinVelocity));
                this.angle += this.spinVelocity;

                this.phase += this.phaseSpeed;

                if (this.y > height - 100) {
                    this.opacity -= 0.01;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, this.opacity);

                if (this.type === 'marigold') {
                    ctx.fillStyle = Math.random() > 0.5 ? '#d35400' : '#f1c40f';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, 2 * Math.PI);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        let particlesArray = [];
        let smokeArray = [];

        let keyboardAirX = 0;
        let keyboardAirY = 0;
        let airPulseTimer = null;

        let particleMotionFrozen = false;
        let volumeLimitKey = null;

        const warmFlash = document.getElementById('keyboard-warm-flash');

        function triggerWarmFlash() {
            warmFlash.classList.remove('active');
            void warmFlash.offsetWidth;
            warmFlash.classList.add('active');
        }

        function setKeyboardAirX(direction) {
            keyboardAirX = direction * 5.5;
        }

        function triggerAirPulse(direction, duration = 300) {
            setKeyboardAirX(direction);
            clearTimeout(airPulseTimer);
            airPulseTimer = setTimeout(() => {
                releaseKeyboardAirX();
            }, duration);
        }

        function setKeyboardAirY(direction) {
            keyboardAirY = direction * 10;
        }

        function releaseKeyboardAirX() {
            keyboardAirX = 0;
        }

        function releaseKeyboardAirY() {
            keyboardAirY = 0;
        }

        function addFestiveShower(x, y, amount = 10) {
            for (let i = 0; i < amount; i++) {
                particlesArray.push(new FestiveParticle(x + (Math.random() * 60 - 30), y + (Math.random() * 40 - 20)));
            }
        }

        function addAmbientFlora() {
            if (particlesArray.length < 80) {
                particlesArray.push(new FestiveParticle(Math.random() * width, -20));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            const dx = mouse.x - springPoint.x;
            const dy = mouse.y - springPoint.y;

            const ax = dx * STIFFNESS;
            const ay = dy * STIFFNESS;

            springPoint.vx = (springPoint.vx + ax) * DAMPING;
            springPoint.vy = (springPoint.vy + ay) * DAMPING;

            springPoint.x += springPoint.vx;
            springPoint.y += springPoint.vy;

            ctx.save();
            const glowRadius = 75;
            const redGlow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, glowRadius);
            redGlow.addColorStop(0, 'rgba(235, 45, 20, 0.85)');
            redGlow.addColorStop(0.3, 'rgba(211, 84, 0, 0.5)');
            redGlow.addColorStop(0.7, 'rgba(180, 20, 10, 0.15)');
            redGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = redGlow;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, glowRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const speed = Math.hypot(springPoint.vx, springPoint.vy);
            if (speed > 0.15) {
                for (let i = 0; i < SMOKE_DENSITY; i++) {
                    smokeArray.push(new SmokeParticle(springPoint.x, springPoint.y, springPoint.vx, springPoint.vy));
                }
            }

            if (speed > 1.2) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(mouse.x, mouse.y);
                ctx.lineTo(springPoint.x, springPoint.y);
                ctx.strokeStyle = `rgba(235, 60, 30, ${Math.min(0.35, speed * 0.03)})`;
                ctx.lineWidth = 1.2;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();
            }

            for (let i = smokeArray.length - 1; i >= 0; i--) {
                const smoke = smokeArray[i];
                smoke.update();
                smoke.draw();

                if (smoke.opacity <= 0) {
                    smokeArray.splice(i, 1);
                }
            }

            if (Math.random() < 0.1) {
                addAmbientFlora();
            }

            for (let i = particlesArray.length - 1; i >= 0; i--) {
                const p = particlesArray[i];
                p.update();
                p.draw();

                if (p.y > height || p.opacity <= 0) {
                    particlesArray.splice(i, 1);
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Interaction Listeners
        document.addEventListener('click', (e) => {
            if (e.target.closest('.glass-player')) return;

            addFestiveShower(e.clientX, e.clientY, 15);

            document.getElementById('main-view').style.transform = 'scale(0.992)';
            setTimeout(() => {
                document.getElementById('main-view').style.transform = 'scale(1)';
            }, 80);
        });

        // Durga Puja countdown
        const PUJA_START_DATE = new Date('2026-10-16T00:00:00+05:30');
        const BENGAL_LATITUDE = 22.5726;   // Kolkata
        const BENGAL_LONGITUDE = 88.3639; // Kolkata
        const BENGAL_TIME_ZONE = 'Asia/Kolkata';

        function toBengaliDigits(value) {
            const bengaliDigits = '০১২৩৪৫৬৭৮৯';
            return String(value).replace(/\d/g, digit => bengaliDigits[digit]);
        }

        function getKolkataDateParts(date) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: BENGAL_TIME_ZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(date);

            const result = {};
            for (const part of parts) {
                if (part.type !== 'literal') result[part.type] = Number(part.value);
            }
            return result;
        }

        function getSunriseMinutesUTC(year, month, day, latitude, longitude) {
            const rad = Math.PI / 180;
            const deg = 180 / Math.PI;

            const date = new Date(Date.UTC(year, month - 1, day));
            const start = new Date(Date.UTC(year, 0, 1));
            const dayOfYear = Math.floor((date - start) / 86400000) + 1;

            const lngHour = longitude / 15;
            const zenith = 90.833;

            const approximateTime = dayOfYear + ((6 - lngHour) / 24);

            const sunMeanAnomaly =
                (0.9856 * approximateTime) - 3.289;

            let sunTrueLongitude =
                sunMeanAnomaly +
                (1.916 * Math.sin(sunMeanAnomaly * rad)) +
                (0.020 * Math.sin(2 * sunMeanAnomaly * rad)) +
                282.634;

            sunTrueLongitude = ((sunTrueLongitude % 360) + 360) % 360;

            let rightAscension =
                deg * Math.atan(0.91764 * Math.tan(sunTrueLongitude * rad));
            rightAscension = ((rightAscension % 360) + 360) % 360;

            const lQuadrant =
                Math.floor(sunTrueLongitude / 90) * 90;
            const raQuadrant =
                Math.floor(rightAscension / 90) * 90;

            rightAscension += lQuadrant - raQuadrant;
            rightAscension /= 15;

            const sinDeclination =
                0.39782 * Math.sin(sunTrueLongitude * rad);
            const cosDeclination =
                Math.cos(Math.asin(sinDeclination));

            const cosHourAngle =
                (Math.cos(zenith * rad) -
                    (sinDeclination * Math.sin(latitude * rad))) /
                (cosDeclination * Math.cos(latitude * rad));

            if (cosHourAngle > 1) return null;
            if (cosHourAngle < -1) return null;

            const hourAngle = 360 - deg * Math.acos(cosHourAngle);
            const localHourAngle = hourAngle / 15;

            const localMeanTime =
                localHourAngle +
                rightAscension -
                (0.06571 * approximateTime) -
                6.622;

            let utcHour = localMeanTime - lngHour;
            utcHour = ((utcHour % 24) + 24) % 24;

            return utcHour * 60;
        }

        function getSunriseInKolkataForDate(year, month, day) {
            const sunriseUTCMinutes = getSunriseMinutesUTC(
                year,
                month,
                day,
                BENGAL_LATITUDE,
                BENGAL_LONGITUDE
            );

            if (sunriseUTCMinutes === null) {
                return 5 * 60 + 30;
            }

            return (sunriseUTCMinutes + 330) % 1440;
        }

        function getPujaEffectiveDate(now = new Date()) {
            const parts = getKolkataDateParts(now);

            const sunriseMinutes = getSunriseInKolkataForDate(
                parts.year,
                parts.month,
                parts.day
            );

            const currentMinutes =
                parts.hour * 60 +
                parts.minute +
                parts.second / 60;

            const effectiveDate = new Date(
                Date.UTC(parts.year, parts.month - 1, parts.day)
            );

            if (currentMinutes < sunriseMinutes) {
                effectiveDate.setUTCDate(effectiveDate.getUTCDate() - 1);
            }

            return effectiveDate;
        }

        function updatePujaCountdown() {
            const daysElement = document.getElementById('puja-days');
            if (!daysElement) return;

            const effectiveDate = getPujaEffectiveDate();

            const targetDateOnly = new Date(Date.UTC(
                PUJA_START_DATE.getUTCFullYear(),
                PUJA_START_DATE.getUTCMonth(),
                PUJA_START_DATE.getUTCDate()
            ));

            let daysRemaining = Math.ceil(
                (targetDateOnly - effectiveDate) / 86400000
            );

            daysRemaining = Math.max(0, daysRemaining);

            daysElement.textContent = toBengaliDigits(daysRemaining);
        }

        updatePujaCountdown();
        setInterval(updatePujaCountdown, 30000);

        // YouTube Player Logic
        let player;
        const playlistId = 'PLC93JxTh6p2c';
        let isPlayerReady = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '200',
                width: '200',
                playerVars: {
                    listType: 'playlist',
                    list: playlistId,
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    rel: 0,
                    enablejsapi: 1,
                    modestbranding: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const trackNameEl = document.getElementById('track-name');
        const trackStatusEl = document.getElementById('track-status');
        const vinylDisc = document.getElementById('vinyl-disc');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const progressArea = document.getElementById('progress-area');
        const timeCurrentEl = document.getElementById('time-current');
        const timeTotalEl = document.getElementById('time-total');

        const playlistToggle = document.getElementById('playlist-toggle');
        const playlistPanel = document.getElementById('playlist-panel');
        const playlistList = document.getElementById('playlist-list');
        const swipeTrackArea = document.getElementById('swipe-track-area');

        let playlistItems = [];
        let currentPlaylistIndex = -1;
        let isPlaylistLoaded = false;

        let isPlaying = false;
        let progressInterval;

        function onPlayerReady(event) {
            isPlayerReady = true;
            trackStatusEl.textContent = "Nostalgia Ready";
            trackNameEl.textContent = "Click Play to Hear Agomoni Classics";

            btnPlayPause.addEventListener('click', togglePlay);
            btnNext.addEventListener('click', nextTrack);
            btnPrev.addEventListener('click', prevTrack);
            progressArea.addEventListener('click', seekTo);

            playlistToggle.addEventListener('click', togglePlaylist);
            setupTrackSwipe();
            loadYouTubePlaylist();
        }

        function onPlayerError(event) {
            console.error("YouTube Player Error Code:", event.data);
            trackStatusEl.textContent = "Error Loading Playlist";
            trackNameEl.textContent = "Check playlist ID or embed permissions";
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                const currentVideoId =
                    typeof player.getVideoData === 'function'
                        ? player.getVideoData().video_id
                        : null;

                if (
                    currentVideoId !== lastStartedVideoId ||
                    lastPlayerState !== YT.PlayerState.PLAYING
                ) {
                    playGlitchSound();
                }

                lastStartedVideoId = currentVideoId;
                lastPlayerState = event.data;
            } else if (event.data === YT.PlayerState.PAUSED) {
                playGlitchSound();
                lastPlayerState = event.data;
            } else {
                lastPlayerState = event.data;
            }

            const trackData = player.getVideoData();

            if (trackData && trackData.title) {
                trackNameEl.textContent = trackData.title;
            }

            if (isPlaylistLoaded) {
                const currentVideoId = trackData && trackData.video_id;
                const matchedItem = playlistItems.find(item => item.videoId === currentVideoId);
                if (matchedItem) {
                    currentPlaylistIndex = matchedItem.index;
                    updateActivePlaylistItem();
                }
            }

            if (trackData && trackData.video_id) {
                const thumbnailUrl = `https://img.youtube.com/vi/${trackData.video_id}/hqdefault.jpg`;
                vinylDisc.style.backgroundImage = `url('${thumbnailUrl}')`;
            }

            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                vinylDisc.style.animationPlayState = 'running';

                btnPlayPause.innerHTML = '<i data-feather="pause"></i>';
                btnPlayPause.setAttribute('title', 'Pause');
                feather.replace();

                trackStatusEl.textContent = "Now Playing";
                startProgressTimer();
            } else {
                isPlaying = false;
                vinylDisc.style.animationPlayState = 'paused';

                btnPlayPause.innerHTML = '<i data-feather="play"></i>';
                btnPlayPause.setAttribute('title', 'Play');
                feather.replace();

                trackStatusEl.textContent = event.data === YT.PlayerState.BUFFERING ? "Buffering Memory..." : "Paused";
                clearInterval(progressInterval);
            }
        }

        function togglePlay() {
            initAudio();
            if (!isPlayerReady) return;

            if (!isPlaying) {
                player.playVideo();
            } else {
                player.pauseVideo();
            }
        }

        function nextTrack() {
            playRadioGlitch();
            triggerAirPulse(1);
            if (isPlayerReady) player.nextVideo();
        }

        function prevTrack() {
            playRadioGlitch();
            triggerAirPulse(-1);
            if (isPlayerReady) player.previousVideo();
        }

        function togglePlaylist() {
            const isOpen = playlistPanel.classList.toggle('open');
            playlistToggle.classList.toggle('open', isOpen);
            playlistToggle.setAttribute('aria-expanded', String(isOpen));
            playlistToggle.setAttribute('title', isOpen ? 'Hide playlist' : 'Show playlist');
        }

        async function loadYouTubePlaylist() {
            if (!isPlayerReady || !player || isPlaylistLoaded) return;

            const ids = player.getPlaylist();

            if (!ids || !ids.length) {
                setTimeout(loadYouTubePlaylist, 500);
                return;
            }

            playlistItems = ids.map((videoId, index) => ({
                videoId,
                index,
                title: `Track ${index + 1}`,
                thumbnail: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`
            }));

            renderPlaylist();
            isPlaylistLoaded = true;
            updateActivePlaylistItem();

            await Promise.all(playlistItems.map(async (item) => {
                try {
                    const response = await fetch(
                        `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${encodeURIComponent(item.videoId)}&format=json`
                    );
                    if (response.ok) {
                        const data = await response.json();
                        if (data.title) item.title = data.title;
                    }
                } catch (error) {
                    console.warn('Could not load title for', item.videoId, error);
                }
            }));

            renderPlaylist();
            updateActivePlaylistItem();
        }

        function renderPlaylist() {
            if (!playlistItems.length) {
                playlistList.innerHTML = '<div class="playlist-loading">No tracks found.</div>';
                return;
            }

            playlistList.innerHTML = playlistItems.map((item) => `
                <button class="playlist-item${item.index === currentPlaylistIndex ? ' active' : ''}"
                        data-index="${item.index}"
                        title="${escapeHtml(item.title)}">
                    <img class="playlist-thumb"
                         src="${item.thumbnail}"
                         alt=""
                         loading="lazy">
                    <span class="playlist-item-info">
                        <span class="playlist-item-title">${escapeHtml(item.title)}</span>
                        <span class="playlist-item-number">Track ${item.index + 1}</span>
                    </span>
                </button>
            `).join('');

            playlistList.querySelectorAll('.playlist-item').forEach((itemEl) => {
                itemEl.addEventListener('click', () => {
                    const index = Number(itemEl.dataset.index);
                    playPlaylistTrack(index);
                });
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function playPlaylistTrack(index) {
            if (!isPlayerReady || !playlistItems[index]) return;

            playRadioGlitch();
            currentPlaylistIndex = index;
            player.playVideoAt(index);
            updateActivePlaylistItem();
        }

        function updateActivePlaylistItem() {
            if (!playlistList) return;

            playlistList.querySelectorAll('.playlist-item').forEach((itemEl) => {
                itemEl.classList.toggle(
                    'active',
                    Number(itemEl.dataset.index) === currentPlaylistIndex
                );
            });

            const activeItem = playlistList.querySelector('.playlist-item.active');
            if (activeItem && playlistPanel.classList.contains('open')) {
                activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function setupTrackSwipe() {
            let startX = 0;
            let startY = 0;
            let mouseStartX = 0;
            let mouseStartY = 0;
            let mouseDragging = false;
            let wheelGestureLocked = false;
            let wheelDeltaX = 0;
            let wheelDeltaY = 0;
            let wheelResetTimer;

            const SWIPE_DISTANCE = 50;

            function handleHorizontalGesture(deltaX, deltaY = 0) {
                if (Math.abs(deltaX) < SWIPE_DISTANCE) return false;
                if (Math.abs(deltaX) < Math.abs(deltaY)) return false;

                if (deltaX < 0) {
                    nextTrack();
                } else {
                    prevTrack();
                }

                return true;
            }

            swipeTrackArea.addEventListener('touchstart', (event) => {
                if (!event.touches.length) return;
                startX = event.touches[0].clientX;
                startY = event.touches[0].clientY;
            }, { passive: true });

            swipeTrackArea.addEventListener('touchend', (event) => {
                if (!event.changedTouches.length) return;

                const touch = event.changedTouches[0];
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;

                handleHorizontalGesture(deltaX, deltaY);
            }, { passive: true });

            swipeTrackArea.addEventListener('wheel', (event) => {
                if (Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
                if (Math.abs(event.deltaX) < 2) return;

                event.preventDefault();

                wheelDeltaX += event.deltaX;
                wheelDeltaY += event.deltaY;

                clearTimeout(wheelResetTimer);
                wheelResetTimer = setTimeout(() => {
                    wheelDeltaX = 0;
                    wheelDeltaY = 0;
                    wheelGestureLocked = false;
                }, 120);

                if (!wheelGestureLocked && Math.abs(wheelDeltaX) >= 55) {
                    wheelGestureLocked = true;

                    if (wheelDeltaX > 0) {
                        nextTrack();
                    } else {
                        prevTrack();
                    }

                    wheelDeltaX = 0;
                    wheelDeltaY = 0;
                }
            }, { passive: false });

            swipeTrackArea.addEventListener('mousedown', (event) => {
                if (event.button !== 0) return;

                mouseDragging = true;
                mouseStartX = event.clientX;
                mouseStartY = event.clientY;
                swipeTrackArea.classList.add('swiping');
            });

            window.addEventListener('mousemove', (event) => {
                if (!mouseDragging) return;

                const deltaX = event.clientX - mouseStartX;
                const deltaY = event.clientY - mouseStartY;

                if (Math.abs(deltaX) > 10 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    event.preventDefault();
                }
            });

            window.addEventListener('mouseup', (event) => {
                if (!mouseDragging) return;

                const deltaX = event.clientX - mouseStartX;
                const deltaY = event.clientY - mouseStartY;

                mouseDragging = false;
                swipeTrackArea.classList.remove('swiping');

                handleHorizontalGesture(deltaX, deltaY);
            });

            swipeTrackArea.addEventListener('dragstart', (event) => {
                event.preventDefault();
            });
        }

        // Sound Feedback UI
        const dhakSound = document.getElementById('dhak-sound');
        const glitchSound = document.getElementById('glitch-sound');

        function playUISound(audio) {
            if (!audio) return;
            audio.currentTime = 0;
            const promise = audio.play();
            if (promise && typeof promise.catch === 'function') {
                promise.catch(() => { });
            }
        }

        function playDhakSound() {
            playUISound(dhakSound);
        }

        function playGlitchSound() {
            playUISound(glitchSound);
        }

        // Background click triggers dhak
        document.addEventListener('click', (event) => {
            if (event.target.closest('.glass-player')) return;
            playDhakSound();
        }, true);

        let lastStartedVideoId = null;
        let lastPlayerState = null;

        // Keyboard Controls
        document.addEventListener('keydown', (event) => {
            const target = event.target;
            const isTyping =
                target &&
                (target.tagName === 'INPUT' ||
                    target.tagName === 'TEXTAREA' ||
                    target.isContentEditable);

            if (isTyping) return;

            const handledKeys = [' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
            if (!handledKeys.includes(event.key)) return;

            event.preventDefault();

            if (!isPlayerReady || !player) return;

            if (event.key === 'ArrowLeft') {
                setKeyboardAirX(-1);
            } else if (event.key === 'ArrowRight') {
                setKeyboardAirX(1);
            } else if (event.key === 'ArrowUp') {
                setKeyboardAirY(-1);
            } else if (event.key === 'ArrowDown') {
                setKeyboardAirY(1);
            }

            if (event.repeat && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
                return;
            }

            switch (event.key) {
                case ' ':
                    addFestiveShower(width / 2, height / 2 + 100, 20);
                    document.getElementById('main-view').style.transform = 'scale(0.985)';
                    setTimeout(() => {
                        document.getElementById('main-view').style.transform = 'scale(1)';
                    }, 80);

                    togglePlay();
                    break;

                case 'ArrowUp': {
                    const currentVolume = player.getVolume();
                    const newVolume = Math.min(100, currentVolume + 5);
                    player.setVolume(newVolume);

                    if (currentVolume >= 100 || newVolume >= 100) {
                        if (currentVolume >= 100 || event.repeat) {
                            particleMotionFrozen = true;
                            volumeLimitKey = 'ArrowUp';
                            triggerWarmFlash();
                        }
                    } else {
                        particleMotionFrozen = false;
                        volumeLimitKey = null;
                    }
                    break;
                }

                case 'ArrowDown': {
                    const currentVolume = player.getVolume();
                    const newVolume = Math.max(0, currentVolume - 5);
                    player.setVolume(newVolume);

                    if (currentVolume <= 0 || newVolume <= 0) {
                        if (currentVolume <= 0 || event.repeat) {
                            particleMotionFrozen = true;
                            volumeLimitKey = 'ArrowDown';
                            triggerWarmFlash();
                        }
                    } else {
                        particleMotionFrozen = false;
                        volumeLimitKey = null;
                    }
                    break;
                }

                case 'ArrowLeft':
                    prevTrack();
                    break;

                case 'ArrowRight':
                    nextTrack();
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
                releaseKeyboardAirX();
            }

            if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                releaseKeyboardAirY();
            }

            if (
                (event.key === 'ArrowUp' || event.key === 'ArrowDown') &&
                event.key === volumeLimitKey
            ) {
                particleMotionFrozen = false;
                volumeLimitKey = null;
            }
        });

        function seekTo(e) {
            if (!isPlayerReady) return;
            const rect = progressArea.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            if (duration) {
                player.seekTo(duration * clickPosition, true);
            }
        }

        function startProgressTimer() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!isPlayerReady) return;
                const current = player.getCurrentTime();
                const total = player.getDuration();
                if (total > 0) {
                    const percentage = (current / total) * 100;
                    progressBarFill.style.width = percentage + '%';
                    timeCurrentEl.textContent = formatTime(current);
                    timeTotalEl.textContent = formatTime(total);
                }
            }, 300);
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }
    </script>
</body>
